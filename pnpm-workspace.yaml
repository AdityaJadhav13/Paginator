packages:
  - "apps/*"
  - "packages/*"
  - "tools/testkit"

# Every version is pinned exactly (tools/ts/check-graph.ts fails on ^ or ~).
catalog:
  # TypeScript 7 (native) provides `tsc`; typescript-eslint needs the 6.x API (peer <6.1.0),
  # served by the official compatibility package under the `typescript` name.
  "@typescript/native": "npm:typescript@7.0.2"
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@types/node": "24.19.2"
  vitest: "5.0.1"
  eslint: "10.12.0"
  "@eslint/js": "10.0.1"
  typescript-eslint: "8.71.2"
  "@eslint-community/eslint-plugin-eslint-comments": "4.8.1"
  eslint-config-prettier: "10.1.8"
  globals: "17.13.0"
  prettier: "3.9.10"
  # Zod 4: the shared schemas (packages/contracts) and the API; MIT.
  zod: "4.6.7"
  # The API (apps/api); MIT.
  fastify: "5.12.7"
  fastify-type-provider-zod: "7.0.0"
  # Required peers of fastify-type-provider-zod; its types import them (nothing loads them at run time yet).
  "@fastify/swagger": "9.9.2"
  # The story bundle for the Desk (plan §10 PR 24): ZIP streaming, no dependencies; MIT.
  fflate: "0.8.3"
  openapi-types: "12.1.3"
  # The API's security baseline (Helmet, the request limit); MIT.
  "@fastify/helmet": "13.2.0"
  "@fastify/rate-limit": "11.2.1"
  # The API's database: Kysely over node-postgres; MIT.
  kysely: "0.29.7"
  pg: "8.23.1"
  "@types/pg": "8.23.1"
  # The API's email (verification, password reset, new sign-in); MIT-0. 10.1.7 (2026-10-18): the newest 10.1.x, with
  # the three addressparser fixes of 10.1.4 (GHSA-8c8m-p3m8-cjg8, GHSA-m943-m63m-w62w, GHSA-85x2-q946-cp5h).
  nodemailer: "10.1.7"
  # Sign-in (docs/product/10-l2-newsroom-plan.md §4.1); MIT. 1.7.8: the newest 7 days old, with the password-reset and
  # session-revocation fixes (#11626, #11646); later 1.7.x releases fix nothing our configuration uses but #11521,
  # which src/db/pools.ts works around.
  better-auth: "1.7.8"
  # S3 (plan §6, PR 18): 3.1152.0, the newest release at least 7 days old on 2026-10-22 (3.1153.0 is younger)
  "@aws-sdk/client-s3": "3.1152.0"
  "@aws-sdk/s3-presigned-post": "3.1152.0"
  "@aws-sdk/s3-request-presigner": "3.1152.0"
  # The engine's queue (apps/engine-queue): Graphile Worker over node-postgres, owner decision 2026-10-24; MIT. Its
  # configuration loader brings argparse 2.0.1 (Python-2.0, reviewed: tools/ts/check-licences.ts).
  graphile-worker: "0.18.0"

overrides:
  typescript: "npm:@typescript/typescript6@6.0.2"

engineStrict: true

# Supply chain: pnpm resolves no version younger than 7 days (10080 minutes), direct or transitive, and re-checks every
# lockfile entry against the same rule on each install. An exception names exact versions only (name@x.y.z), each
# with its reason and the date it can go (docs/DEVELOPMENT.md, "Supply chain").
minimumReleaseAge: 10080
# A registry answer without publish times fails the install instead of passing the rule unchecked.
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # Already in the lockfile when the rule arrived (2026-10-21), each then younger than 7 days. Remove each entry once
  # its date has passed (docs/product/11-fix-before-launch.md).
  - "undici@8.12.2" # web tests (jsdom); published 2026-10-15T15:05Z: remove after 2026-10-22T15:05Z
  - "set-cookie-parser@3.1.4" # fastify (light-my-request); 2026-10-16T17:37Z: remove after 2026-10-23T17:37Z
  - "@asamuzakjp/css-color@7.1.7" # web tests (jsdom); 2026-10-17T09:33Z: remove after 2026-10-24T09:33Z
  - "kysely@0.29.7" # the API's database (L2-B); 2026-10-17T15:49Z: remove after 2026-10-24T15:49Z
  - "ret@0.5.1" # fastify (safe-regex2); 2026-10-17T21:32Z: remove after 2026-10-24T21:32Z
  - "postcss@8.5.31" # web build (Vite); 2026-10-18T19:39Z: remove after 2026-10-25T19:39Z
  - "fast-json-stringify@7.1.1" # fastify; 2026-10-18T21:08Z: remove after 2026-10-25T21:08Z
