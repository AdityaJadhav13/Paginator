# Local development services (docs/product/10-l2-newsroom-plan.md §7.1). Use the root scripts
# (pnpm dev:up / dev:down / dev:reset): they pass `-p pageinator`, so no command reaches another project's containers,
# and `--env-file .env.dev` (copy .env.dev.example). Each service receives only the settings listed under it, and
# compose refuses to start while any of them is missing or empty. The names in .env.dev start with PGN_ because a
# shell variable of the same name would win over the file (a developer's own AWS_* keys, for example).
# Ports are bound to 127.0.0.1 only. Images are pinned by digest, with the tag in the comment.
# Inside the pageinator_default network, every port of the s3 container except S3's 8333 answers without
# authentication: the filer (8888), master (9333) and volume server (8080), their gRPC ports (18888, 19333, 18080),
# and the S3 gateway's gRPC port (18333), whose PutIdentity and PutPolicy calls could mint an S3 key pair. The engine
# container (L2.2) must use S3 only, or those ports must be bound to 127.0.0.1 inside the s3 container.
name: pageinator

services:
  db:
    image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # postgres:18.6-trixie
    environment:
      POSTGRES_DB: pageinator
      POSTGRES_PASSWORD: ${PGN_POSTGRES_PASSWORD:?set it in .env.dev}
      PGN_MIGRATOR_PASSWORD: ${PGN_MIGRATOR_PASSWORD:?set it in .env.dev}
      PGN_APP_PASSWORD: ${PGN_APP_PASSWORD:?set it in .env.dev}
      PGN_AUTH_PASSWORD: ${PGN_AUTH_PASSWORD:?set it in .env.dev}
      PGN_ENGINE_PASSWORD: ${PGN_ENGINE_PASSWORD:?set it in .env.dev}
      PGN_LISTEN_PASSWORD: ${PGN_LISTEN_PASSWORD:?set it in .env.dev}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql # Postgres 18 images keep PGDATA in /var/lib/postgresql/18/docker
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      # Over TCP (while the init SQL runs, the server listens on its socket only), and only once the init SQL has
      # finished: its roles exist and the public schema is closed, so a half-initialised data directory never counts.
      test:
        [
          "CMD-SHELL",
          'psql --host=127.0.0.1 --username=postgres --dbname=pageinator --no-psqlrc --tuples-only --no-align --command="select count(*) = 6 and not has_schema_privilege(''public'', ''public'', ''USAGE'') from pg_roles where rolname in (''pgn_owner'', ''pgn_migrator'', ''pgn_app'', ''pgn_auth'', ''pgn_engine'', ''pgn_listen'')" | grep -qx t',
        ]
      interval: 30s # every second while starting, then every 30 s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 3

  s3:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d # chrislusf/seaweedfs:4.48
    # master, volume server, filer and S3 gateway in one process; listen on every interface inside the container;
    # no Iceberg (8181) or Lance (9101) server
    command: ["server", "-s3", "-ip.bind=0.0.0.0", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment:
      # SeaweedFS's only S3 identity. Without both keys it has no identity and lets every request in.
      AWS_ACCESS_KEY_ID: ${PGN_S3_ACCESS_KEY_ID:?set it in .env.dev}
      AWS_SECRET_ACCESS_KEY: ${PGN_S3_SECRET_ACCESS_KEY:?set it in .env.dev}
    ports:
      - "127.0.0.1:58333:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      # Healthy only while it answers and refuses an anonymous request with exactly 403: without its identity it would
      # let anyone in, and `pnpm dev:up` must fail then. (curl is in the image; BusyBox wget fails on any error status.)
      test:
        [
          "CMD-SHELL",
          '[ "$$(curl -s -o /dev/null -w ''%{http_code}'' http://127.0.0.1:8333/healthz)" = 200 ] && [ "$$(curl -s -o /dev/null -w ''%{http_code}'' http://127.0.0.1:8333/)" = 403 ]',
        ]
      interval: 30s # every second while starting, then every 30 s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 3

  mail:
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387 # axllent/mailpit:v1.31.6
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:58025:8025" # web UI and API
      - "127.0.0.1:51025:1025" # SMTP
    volumes:
      - mail-data:/data
    # health check: the image's own (`/mailpit readyz`)

volumes:
  db-data:
  s3-data:
  mail-data:
