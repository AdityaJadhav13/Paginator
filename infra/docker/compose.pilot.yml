# The pilot (docs/product/10-l2-newsroom-plan.md §8.2; PR 25), and a copy of it on one machine (profile pilot-local).
# infra/deploy/deploy.sh runs it; docs/runbooks/deploy.md says how. Two profiles; one is always named:
#   pilot        on the EC2 app host: Caddy, the API, the migration step, the nightly backup, the engine's queue and the
#                page editor's edit gateway (both from the worker image), against RDS, S3 and SES. Logs go to
#                CloudWatch (awslogs; the instance role may write them).
#   pilot-local  the same images and settings on a developer's machine, with a scratch Postgres and SeaweedFS of its
#                own: Caddy's local CA on app.localhost, a Mailpit that catches every email (mail-local), local logs.
#                It must run under its own project name
#                (-p pgn-pilot-local), never the development stack's (pageinator).
# Every setting comes from one env file (--env-file): in the pilot /etc/pageinator/pilot.env, root-only, which deploy.sh
# writes from SSM Parameter Store (docs/runbooks/aws-setup.md lists every name). Each service gets only the settings
# listed under it, and compose refuses to start while one of them is missing or empty (but the optional ones:
# PGN_CONTACT_TO, PGN_ANTHROPIC_API_KEY and those with a default). No secret is in an image.
# Images: ${PGN_REGISTRY}/pageinator-{api,web,backup,engine-worker}:${PGN_IMAGE_TAG}, built from infra/docker/*.Dockerfile (the
# pilot pushes them to ECR; deploy.sh sets the tag). Other images are pinned by digest, with the tag in the comment.
#
# Addresses: one network with a fixed subnet (PGN_NET_SUBNET), where Caddy has a fixed address (PGN_CADDY_IP). The
# API believes X-Forwarded-For from that address only (PGN_TRUST_PROXY). The subnet must not overlap the VPC's.
# Stopping: the API waits PGN_SHUTDOWN_GRACE_S (10 s) for requests in flight and gives up 5 s after that (src/shutdown.ts),
# so compose waits 20 s before it kills it. init: true puts tini in front, so a second stop signal still kills it.
# Memory: every container has a ceiling (mem_limit), so one that grows cannot take the host down with it: Caddy 128 MB,
# the API 640 MB, the backup 256 MB, the engine 2 GB (two jobs at once, PGN_QUEUE_CONCURRENCY 2, so photos are not held
# behind a layout; layouts take turns on the engine-cpu queue), the edit gateway 1 GB (one Desk edit session per
# publication), 4 GB together, and the migration step's 384 MB while it runs: the host must be a t3.large (8 GB) once
# the engine and the gateway run on it (plan §8.1 puts them on an engine host of their own later). pilot-local's
# scratch database gets 512 MB, its file store 1 GB.
# The engine's layout pool follows its container's CPUs and memory (desk_engine.py pool_workers: one process per CPU but
# one, each budgeted 768 MiB beside 1.4 GiB for the engine's own process, the queue and the other job), so 2 GB runs one
# layout process. Measured in the worker image at 2 CPUs and 2 GB: an 8-page edition peaked at 754 MiB (the engine 256,
# its layout process 368), no kill. The other job, a photo's conversion, peaked at 99 MB for the pilot's largest real
# photo; a 100-megapixel picture (the API's largest) at 186 MB as a JPEG, 387 MB as a progressive JPEG, 886 MB as a PNG
# and 1.66 GB as a PNG with transparency: over its 1 GB, so beside a layout the kernel kills one of them (doc 11 L2-325).
# The engine (the queue, apps/engine-queue/src/main.ts) stops only after its running jobs end: at most
# PGN_RUNNER_TIMEOUT_S (180 s), then 5 s; a layout run still going then gets SIGTERM and 10 s more (L2.3: it is failed
# with the Desk's RESTARTED message), so compose waits 210 s before it kills it (a job killed mid-run stays locked
# until the queue releases stale locks, or the API's sweep on its last attempt). A layout may run PGN_LAYOUT_TIMEOUT_S.

x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true

x-aws-logs: &aws-logs
  driver: awslogs
  options:
    awslogs-region: ap-south-1
    awslogs-group: ${PGN_LOG_GROUP:-/pageinator/pilot}
    awslogs-create-group: "false" # made with its 30-day retention (docs/runbooks/aws-setup.md)
    tag: "{{.Name}}"
    mode: non-blocking # a slow CloudWatch never holds up the API; a full 4 MB buffer drops lines instead
    max-buffer-size: 4m

x-local-logs: &local-logs
  driver: local
  options:
    max-size: 10m
    max-file: "3"

# What the API, the migration step and the backup share: where the database is, and how to reach it over TLS
# (verify-full against the RDS certificate bundle in the pilot; disable for the scratch database).
x-database: &database
  PGN_DB_HOST: ${PGN_DB_HOST:?}
  PGN_DB_PORT: ${PGN_DB_PORT:-5432}
  PGN_DB_NAME: ${PGN_DB_NAME:?}
  PGSSLMODE: ${PGSSLMODE:?}

x-api-environment: &api-environment
  <<: *database
  PGN_API_HOST: 0.0.0.0
  PGN_API_PORT: "8780"
  PGN_TRUST_PROXY: ${PGN_CADDY_IP:?}
  PGN_SHUTDOWN_GRACE_S: "10"
  PGN_LOG_LEVEL: ${PGN_LOG_LEVEL:-info}
  PGN_ALLOWED_ORIGINS: ${PGN_APP_ORIGIN:?}
  PGN_PUBLIC_ORIGIN: ${PGN_APP_ORIGIN:?}
  PGN_APP_PASSWORD: ${PGN_APP_PASSWORD:?}
  PGN_AUTH_PASSWORD: ${PGN_AUTH_PASSWORD:?}
  PGN_LISTEN_PASSWORD: ${PGN_LISTEN_PASSWORD:?}
  PGN_AUTH_SECRET: ${PGN_AUTH_SECRET:?}
  PGN_SMTP_HOST: ${PGN_SMTP_HOST:?}
  PGN_SMTP_PORT: ${PGN_SMTP_PORT:-587}
  PGN_SMTP_USER: ${PGN_SMTP_USER:?}
  PGN_SMTP_PASSWORD: ${PGN_SMTP_PASSWORD:?}
  PGN_MAIL_FROM: ${PGN_MAIL_FROM:?}
  # the public website's contact form sends its messages here (owner's choice, D-2). No value here: compose passes the
  # env file's when it has one, and none otherwise, so the form stays unconnected until the privacy notice is
  # published (D-6; 11-fix-before-launch L2-230). An empty value would stop the API (not one plain address).
  PGN_CONTACT_TO:
  PGN_S3_ENDPOINT: ${PGN_S3_ENDPOINT:?}
  PGN_S3_REGION: ap-south-1
  PGN_S3_ACCESS_KEY_ID: ${PGN_S3_ACCESS_KEY_ID:?}
  PGN_S3_SECRET_ACCESS_KEY: ${PGN_S3_SECRET_ACCESS_KEY:?}
  PGN_S3_WORK_BUCKET: ${PGN_S3_WORK_BUCKET:?}
  PGN_S3_ARCHIVE_BUCKET: ${PGN_S3_ARCHIVE_BUCKET:?}
  # on exactly when the engine has a Claude key: the API never sees the key itself
  PGN_NEWS_AI: ${PGN_ANTHROPIC_API_KEY:+on}
  # the page editor's edit gateway (below): plain http to that service name only, on this host's own network
  PGN_GATEWAY_URL: http://gateway:8790
  PGN_GATEWAY_SECRET: ${PGN_GATEWAY_SECRET:?}
  NODE_EXTRA_CA_CERTS: /etc/pageinator/ca.pem

x-api: &api
  <<: *hardened
  image: ${PGN_REGISTRY:?}/pageinator-api:${PGN_IMAGE_TAG:?}
  environment: *api-environment
  mem_limit: 640m
  stop_grace_period: 20s
  restart: unless-stopped
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:8780/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
      ]
    interval: 30s
    start_interval: 1s
    start_period: 30s
    timeout: 5s
    retries: 3

x-migrate: &migrate
  <<: *hardened
  image: ${PGN_REGISTRY:?}/pageinator-api:${PGN_IMAGE_TAG:?}
  command: ["node", "scripts/db-migrate.ts"]
  mem_limit: 384m
  environment:
    <<: *database
    PGN_MIGRATOR_PASSWORD: ${PGN_MIGRATOR_PASSWORD:?}
    NODE_EXTRA_CA_CERTS: /etc/pageinator/ca.pem
  restart: "no"

x-backup: &backup
  <<: *hardened
  image: ${PGN_REGISTRY:?}/pageinator-backup:${PGN_IMAGE_TAG:?}
  mem_limit: 256m
  environment:
    <<: *database
    PGSSLROOTCERT: /etc/pageinator/ca.pem
    NODE_EXTRA_CA_CERTS: /etc/pageinator/ca.pem
    PGN_BACKUP_PASSWORD: ${PGN_BACKUP_PASSWORD:?}
    PGN_BACKUP_AT_UTC: ${PGN_BACKUP_AT_UTC:-22:30}
    PGN_BACKUP_RETAIN_DAYS: ${PGN_BACKUP_RETAIN_DAYS:-35}
    PGN_S3_ENDPOINT: ${PGN_S3_ENDPOINT:?}
    PGN_S3_REGION: ap-south-1
    # its own key pair, which may only write dumps under postgres/ in the backups bucket and read them back to check
    # them (infra/aws/iam-backup-policy.json): no delete, no list, no other bucket
    PGN_S3_ACCESS_KEY_ID: ${PGN_BACKUP_S3_ACCESS_KEY_ID:?}
    PGN_S3_SECRET_ACCESS_KEY: ${PGN_BACKUP_S3_SECRET_ACCESS_KEY:?}
    PGN_S3_BACKUPS_BUCKET: ${PGN_S3_BACKUPS_BUCKET:?}
    PGN_BACKUP_DIR: /work
  restart: unless-stopped
  stop_grace_period: 5s

# The engine: the queue as pgn_engine, the Python runner it spawns per job, and its own settings only (never the API's
# or the migrator's secrets): the database as pgn_engine, its own S3 key (orgs/ in the work bucket only:
# infra/aws/iam-engine-policy.json), and the newsprint colour profile, mounted read only and checked against
# PGN_ICC_SHA256. The image runs as its own user (10001), the homes on a volume of their own. The news finder's
# Claude key is the engine's alone (empty: the AI part is off, collection still works; owner decision D-26); the queue
# never passes it to the Python runner. The engine needs outbound HTTPS for the feeds, Commons, Openverse and Claude.
x-engine-environment: &engine-environment
  <<: *database
  PGN_ENGINE_PASSWORD: ${PGN_ENGINE_PASSWORD:?}
  PGN_QUEUE_CONCURRENCY: "2"
  PGN_RUNNER_TIMEOUT_S: "180"
  PGN_LAYOUT_TIMEOUT_S: "3600"
  PGN_S3_ENDPOINT: ${PGN_S3_ENDPOINT:?}
  PGN_S3_REGION: ap-south-1
  PGN_S3_ACCESS_KEY_ID: ${PGN_ENGINE_S3_ACCESS_KEY_ID:?}
  PGN_S3_SECRET_ACCESS_KEY: ${PGN_ENGINE_S3_SECRET_ACCESS_KEY:?}
  PGN_S3_WORK_BUCKET: ${PGN_S3_WORK_BUCKET:?}
  PGN_ICC_SHA256: ${PGN_ICC_SHA256:?}
  ANTHROPIC_API_KEY: ${PGN_ANTHROPIC_API_KEY:-}
  PGN_AI_MODEL: ${PGN_AI_MODEL:-claude-opus-5-5}
  PGN_AI_INR_PER_USD: ${PGN_AI_INR_PER_USD:-88}
  NODE_EXTRA_CA_CERTS: /etc/pageinator/ca.pem

x-engine: &engine
  <<: *hardened
  image: ${PGN_REGISTRY:?}/pageinator-engine-worker:${PGN_IMAGE_TAG:?}
  platform: linux/amd64
  environment: *engine-environment
  mem_limit: 2g
  stop_grace_period: 210s
  restart: unless-stopped

# The page editor's edit gateway (L2.4, plan §2.4; apps/engine-worker/pgn_worker/gateway.py): the worker image, its own
# process, the engine's homes volume shared with the queue (a publication's home holds its engine profile and its
# layout runs: the gateway edits them where the queue laid them out), and the engine's own S3 key. The API signs every
# call with PGN_GATEWAY_SECRET (64 or more hex characters; neither side starts without it). No port is published: only
# the API reaches it, as http://gateway:8790 on this host's network. It has no database password and no Claude key. A
# stop ends it at once: a save cut short is refused to the editor, who saves again (Postgres keeps every page's state).
x-gateway-environment: &gateway-environment
  PGN_GATEWAY_HOST: 0.0.0.0
  PGN_GATEWAY_PORT: "8790"
  PGN_GATEWAY_SECRET: ${PGN_GATEWAY_SECRET:?}
  PGN_S3_ENDPOINT: ${PGN_S3_ENDPOINT:?}
  PGN_S3_REGION: ap-south-1
  PGN_S3_ACCESS_KEY_ID: ${PGN_ENGINE_S3_ACCESS_KEY_ID:?}
  PGN_S3_SECRET_ACCESS_KEY: ${PGN_ENGINE_S3_SECRET_ACCESS_KEY:?}
  PGN_S3_WORK_BUCKET: ${PGN_S3_WORK_BUCKET:?}

x-gateway: &gateway
  <<: *hardened
  image: ${PGN_REGISTRY:?}/pageinator-engine-worker:${PGN_IMAGE_TAG:?}
  platform: linux/amd64
  command: ["python", "-B", "-m", "pgn_worker.gateway"]
  environment: *gateway-environment
  mem_limit: 1g
  stop_grace_period: 10s
  restart: unless-stopped
  healthcheck:
    # it answers, and refuses an unsigned request (401); the image's own check is the queue's
    test:
      [
        "CMD",
        "python",
        "-B",
        "-c",
        "import urllib.request as u, urllib.error as e\ntry: u.urlopen('http://127.0.0.1:8790/v1/health', timeout=3)\nexcept e.HTTPError as x: raise SystemExit(x.code != 401)\nelse: raise SystemExit(1)",
      ]
    interval: 30s
    start_interval: 1s
    start_period: 30s
    timeout: 5s
    retries: 3

x-caddy: &caddy
  <<: *hardened
  image: ${PGN_REGISTRY:?}/pageinator-web:${PGN_IMAGE_TAG:?}
  mem_limit: 128m
  environment:
    PGN_DOMAIN: ${PGN_DOMAIN:?}
    PGN_TLS_ISSUER: ${PGN_TLS_ISSUER:?}
    PGN_S3_PUBLIC_ORIGIN: ${PGN_S3_PUBLIC_ORIGIN:?}
    PGN_HTTP_PORT: ${PGN_HTTP_PORT:-80}
    PGN_HTTPS_PORT: ${PGN_HTTPS_PORT:-443}
    PGN_HEALTH_PORT: ${PGN_HEALTH_PORT:-8781}
  volumes:
    - caddy-data:/data # the certificates and their ACME account: kept across deploys
    - caddy-config:/config
    # the owner's legal texts (<doc>.<lang>.txt, docs/runbooks/deploy.md): a host folder, read only; a file copied into
    # it is served at once, with no new image (Caddy runs as 10001: the folder 0755, the files 0644)
    - ${PGN_LEGAL_DIR:-/etc/pageinator/legal}:/srv/legal-text:ro
  restart: unless-stopped
  stop_grace_period: 10s

services:
  # ---- pilot -------------------------------------------------------------------------------------------------------
  caddy:
    <<: *caddy
    profiles: [pilot]
    ports:
      - "80:80"
      - "443:443"
      # the monitor's port, on the host's private address only; the security group lets in only Uptime Kuma
      - "${PGN_HEALTH_BIND:?}:8781:8781"
    networks:
      pilot:
        ipv4_address: ${PGN_CADDY_IP:?}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8781/healthz"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 3
    logging: *aws-logs

  api:
    <<: *api
    profiles: [pilot]
    volumes:
      - ${PGN_DB_CA_FILE:-/etc/pageinator/rds-ca.pem}:/etc/pageinator/ca.pem:ro
    networks: [pilot]
    logging: *aws-logs

  migrate:
    <<: *migrate
    # a profile of its own, so `up` never starts it; `run --rm migrate` names it, which is enough
    profiles: [pilot-migrate]
    volumes:
      - ${PGN_DB_CA_FILE:-/etc/pageinator/rds-ca.pem}:/etc/pageinator/ca.pem:ro
    networks: [pilot]
    logging: *aws-logs

  backup:
    <<: *backup
    profiles: [pilot]
    volumes:
      - ${PGN_DB_CA_FILE:-/etc/pageinator/rds-ca.pem}:/etc/pageinator/ca.pem:ro
      - backup-work:/work # the dump waits here (on disk, not in memory) until it is uploaded
    networks: [pilot]
    logging: *aws-logs

  engine:
    <<: *engine
    profiles: [pilot]
    volumes:
      - ${PGN_DB_CA_FILE:-/etc/pageinator/rds-ca.pem}:/etc/pageinator/ca.pem:ro
      - ${PGN_ICC_FILE:?}:/run/pageinator/newsprint.icc:ro
      - engine-homes:/var/lib/pageinator/homes
    networks: [pilot]
    logging: *aws-logs

  gateway:
    <<: *gateway
    profiles: [pilot]
    volumes:
      - engine-homes:/var/lib/pageinator/homes
      - ${PGN_ICC_FILE:?}:/run/pageinator/newsprint.icc:ro # the press test page converts its pictures with it
    networks: [pilot]
    logging: *aws-logs

  # ---- pilot-local ---------------------------------------------------------------------------------------------------
  # The same services, and a scratch database and file store. Caddy listens inside on the same ports as outside
  # (PGN_HTTPS_PORT), so every address works from the browser and from the API alike. The API reaches the store's
  # buckets at https://<bucket>.s3.localhost:<port> through Caddy (the network aliases below), with Caddy's local CA
  # in NODE_EXTRA_CA_CERTS, as it reaches S3 in the pilot. ca-local copies that CA's certificate (not its key, which
  # stays in Caddy's own volume) into a volume of its own for them.
  caddy-local:
    <<: *caddy
    profiles: [pilot-local]
    mem_limit: 256m # it also carries the local file store's traffic (in the pilot the browser reaches S3 itself)
    environment:
      PGN_DOMAIN: localhost
      PGN_TLS_ISSUER: internal
      PGN_S3_PUBLIC_ORIGIN: ${PGN_S3_PUBLIC_ORIGIN:?}
      PGN_S3_LOCAL_HOST: "*.s3.localhost"
      PGN_HTTP_PORT: ${PGN_HTTP_PORT:-59080}
      PGN_HTTPS_PORT: ${PGN_HTTPS_PORT:-59443}
      PGN_HEALTH_PORT: ${PGN_HEALTH_PORT:-59781}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ../caddy/local-s3.caddy:/etc/caddy/local/local-s3.caddy:ro
      # PGN_LEGAL_DIR, a folder of this machine, or by default an empty volume: every legal page says its text is to come
      - ${PGN_LEGAL_DIR:-legal-text-local}:/srv/legal-text:ro
    ports:
      - "127.0.0.1:${PGN_HTTP_PORT:-59080}:${PGN_HTTP_PORT:-59080}"
      - "127.0.0.1:${PGN_HTTPS_PORT:-59443}:${PGN_HTTPS_PORT:-59443}"
      - "127.0.0.1:${PGN_HEALTH_PORT:-59781}:${PGN_HEALTH_PORT:-59781}"
    networks:
      pilot:
        ipv4_address: ${PGN_CADDY_IP:?}
        aliases:
          - ${PGN_S3_WORK_BUCKET:?}.s3.localhost
          - ${PGN_S3_ARCHIVE_BUCKET:?}.s3.localhost
          - ${PGN_S3_BACKUPS_BUCKET:?}.s3.localhost
    healthcheck:
      # ready once its local CA exists: the API and the backup trust it
      test: ["CMD", "test", "-s", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 3
    logging: *local-logs

  ca-local:
    image: ${PGN_REGISTRY:?}/pageinator-web:${PGN_IMAGE_TAG:?}
    profiles: [pilot-local]
    user: "0"
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH] # to read Caddy's 0700 folder, as root without any other capability
    security_opt: [no-new-privileges:true]
    read_only: true
    command: ["sh", "-c", "cp /data/caddy/pki/authorities/local/root.crt /ca/root.crt && chmod 0444 /ca/root.crt"]
    volumes:
      - caddy-data:/data:ro
      - local-ca:/ca
    depends_on:
      caddy-local: { condition: service_healthy }
    network_mode: none
    mem_limit: 32m
    restart: "no"
    logging: *local-logs

  api-local:
    <<: *api
    profiles: [pilot-local]
    volumes:
      - local-ca:/etc/pageinator/ca:ro
    environment:
      <<: *api-environment
      NODE_EXTRA_CA_CERTS: /etc/pageinator/ca/root.crt
      # every email goes to mail-local's Mailpit (in the clear, on this network only: the API allows that name only)
      PGN_SMTP_HOST: mail-local
      PGN_SMTP_PORT: "1025"
      PGN_SMTP_TLS: none
    depends_on:
      ca-local: { condition: service_completed_successfully }
      db-local: { condition: service_healthy }
      mail-local: { condition: service_healthy }
    networks:
      pilot:
        aliases: [api]
    logging: *local-logs

  migrate-local:
    <<: *migrate
    profiles: [pilot-local-migrate]
    environment:
      <<: *database
      PGN_MIGRATOR_PASSWORD: ${PGN_MIGRATOR_PASSWORD:?}
    depends_on:
      db-local: { condition: service_healthy }
    networks: [pilot]
    logging: *local-logs

  backup-local:
    <<: *backup
    profiles: [pilot-local]
    volumes:
      - backup-work:/work
      - local-ca:/etc/pageinator/ca:ro
    environment:
      <<: *database
      NODE_EXTRA_CA_CERTS: /etc/pageinator/ca/root.crt
      PGN_BACKUP_PASSWORD: ${PGN_BACKUP_PASSWORD:?}
      PGN_BACKUP_AT_UTC: ${PGN_BACKUP_AT_UTC:-22:30}
      PGN_BACKUP_RETAIN_DAYS: ${PGN_BACKUP_RETAIN_DAYS:-35}
      PGN_S3_ENDPOINT: ${PGN_S3_ENDPOINT:?}
      PGN_S3_REGION: ap-south-1
      PGN_S3_ACCESS_KEY_ID: ${PGN_BACKUP_S3_ACCESS_KEY_ID:?}
      PGN_S3_SECRET_ACCESS_KEY: ${PGN_BACKUP_S3_SECRET_ACCESS_KEY:?}
      PGN_S3_BACKUPS_BUCKET: ${PGN_S3_BACKUPS_BUCKET:?}
      PGN_BACKUP_DIR: /work
    depends_on:
      ca-local: { condition: service_completed_successfully }
      db-local: { condition: service_healthy }
    networks: [pilot]
    logging: *local-logs

  engine-local:
    <<: *engine
    profiles: [pilot-local]
    # the pilot's engine as it runs on its 2-vCPU t3.large: 2 GB (from x-engine) and 2 CPUs, so its layout pool is the
    # pilot's (one process) on any machine
    cpus: 2
    volumes:
      - local-ca:/etc/pageinator/ca:ro
      - ${PGN_ICC_FILE:?}:/run/pageinator/newsprint.icc:ro
      - engine-homes:/var/lib/pageinator/homes
    environment:
      <<: *engine-environment
      NODE_EXTRA_CA_CERTS: /etc/pageinator/ca/root.crt
      # the runner's S3 client (boto3) trusts Caddy's local CA too (runnerEnv passes AWS_CA_BUNDLE)
      AWS_CA_BUNDLE: /etc/pageinator/ca/root.crt
    depends_on:
      ca-local: { condition: service_completed_successfully }
      db-local: { condition: service_healthy }
    networks: [pilot]
    logging: *local-logs

  gateway-local:
    <<: *gateway
    profiles: [pilot-local]
    volumes:
      - local-ca:/etc/pageinator/ca:ro
      - engine-homes:/var/lib/pageinator/homes
      - ${PGN_ICC_FILE:?}:/run/pageinator/newsprint.icc:ro # the press test page converts its pictures with it
    environment:
      <<: *gateway-environment
      AWS_CA_BUNDLE: /etc/pageinator/ca/root.crt # boto3 trusts Caddy's local CA, as the engine's runner does
    depends_on:
      ca-local: { condition: service_completed_successfully }
    networks:
      pilot:
        aliases: [gateway]
    logging: *local-logs

  # every email the scratch stack sends, read at http://127.0.0.1:<PGN_MAIL_UI_PORT> (Mailpit's page and its API; 59025 by default)
  mail-local:
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387 # axllent/mailpit:v1.31.6
    profiles: [pilot-local]
    mem_limit: 128m
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1" # the API signs in with PGN_SMTP_USER and PGN_SMTP_PASSWORD, whatever they are
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${PGN_MAIL_UI_PORT:-59025}:8025"
    networks: [pilot]
    logging: *local-logs

  db-local:
    image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # postgres:18.6-trixie
    profiles: [pilot-local]
    mem_limit: 512m
    # tini reaps a health check's psql orphaned by its timeout; Postgres as PID 1 took its exit for a crashed backend
    # and restarted every session (seen under load, A22)
    init: true
    environment:
      POSTGRES_DB: ${PGN_DB_NAME:?}
      # (pilot-local only: not :?, which the pilot's settings would then need too; empty, Postgres refuses to start)
      POSTGRES_PASSWORD: ${PGN_POSTGRES_PASSWORD:-}
      PGN_MIGRATOR_PASSWORD: ${PGN_MIGRATOR_PASSWORD:?}
      PGN_APP_PASSWORD: ${PGN_APP_PASSWORD:?}
      PGN_AUTH_PASSWORD: ${PGN_AUTH_PASSWORD:?}
      PGN_ENGINE_PASSWORD: ${PGN_ENGINE_PASSWORD:?}
      PGN_LISTEN_PASSWORD: ${PGN_LISTEN_PASSWORD:?}
      PGN_BACKUP_PASSWORD: ${PGN_BACKUP_PASSWORD:?}
    volumes:
      - db-local-data:/var/lib/postgresql
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - ./backup-role.sql:/docker-entrypoint-initdb.d/20-backup-role.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'psql --host=127.0.0.1 --username=postgres --dbname=$${POSTGRES_DB} --no-psqlrc --tuples-only --no-align --command="select count(*) = 1 from pg_roles where rolname = ''pgn_backup''" | grep -qx t',
        ]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 3
    networks: [pilot]
    logging: *local-logs

  s3-local:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d # chrislusf/seaweedfs:4.48
    profiles: [pilot-local]
    mem_limit: 1g # an engine profile's dataset bundle (hundreds of MB) passes through it
    # virtual-hosted buckets (<bucket>.s3.localhost), as S3 serves them; CORS from each bucket's own rule
    command:
      ["server", "-s3", "-ip.bind=0.0.0.0", "-s3.port.iceberg=0", "-s3.port.lance=0", "-s3.domainName=s3.localhost"]
    environment:
      AWS_ACCESS_KEY_ID: ${PGN_S3_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${PGN_S3_SECRET_ACCESS_KEY:?}
    volumes:
      - s3-local-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '[ "$$(curl -s -o /dev/null -w ''%{http_code}'' http://127.0.0.1:8333/healthz)" = 200 ] && [ "$$(curl -s -o /dev/null -w ''%{http_code}'' http://127.0.0.1:8333/)" = 403 ]',
        ]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 3
    networks: [pilot]
    logging: *local-logs

networks:
  pilot:
    ipam:
      config:
        - subnet: ${PGN_NET_SUBNET:?}

volumes:
  caddy-data:
  caddy-config:
  backup-work:
  local-ca:
  engine-homes:
  db-local-data:
  s3-local-data:
  legal-text-local:
