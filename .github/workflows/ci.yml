name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: privacy and frozen-evidence guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: privacy guard
        env:
          PAGEINATOR_DENYLIST: ${{ secrets.PAGEINATOR_DENYLIST }}
        run: node tools/ts/guard-private.ts
      - name: frozen-evidence guard
        env:
          EVIDENCE_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'evidence-change') && '1' || '0' }}
          GUARD_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: node tools/ts/check-frozen.ts

  ts:
    name: typescript workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:graph
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm --filter @pageinator/web build

  oracle:
    name: frozen python oracle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: oracle files unchanged
        run: node tools/ts/check-oracle-manifest.ts
      - name: oracle tests
        working-directory: tools/oracle/v0
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          uv venv --python 3.11.14 .venv
          uv pip install --python .venv --require-hashes -r requirements.lock
          .venv/bin/python -m pytest -q -p no:cacheprovider -m "not a10" tests/
